<!-- Modal Backdrop für HTMX Modals -->
<div id="modal-backdrop"
     class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex items-center justify-center p-4"
     onclick="if(event.target === this) closeModal()">
    <div id="modal-content" class="relative z-10" onclick="event.stopPropagation()">
        <!-- Modal content will be loaded here via HTMX -->
        <div class="flex items-center justify-center">
            <div class="bg-white rounded-lg shadow-xl p-6">
                <div class="flex items-center gap-3">
                    <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-gray-700">Lädt...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function closeModal() {
    const backdrop = document.getElementById('modal-backdrop');
    if (backdrop) {
        backdrop.remove();
    }
}

// Global escape key handler
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeModal();
    }
});
</script>
