{# Ein Mangel in der Vor-Ort-Schablone; Änderungen werden automatisch gespeichert #}
<div id="defect-{{ defect.pk }}" class="defect-card bg-white rounded-lg shadow border-l-4 border-primary-600"
     {% if is_new %}x-data x-init="$nextTick(() => bvs.focusNew($el))"{% endif %}>
    <form class="bvs-autosave p-4 space-y-3"
          hx-post="{% url 'objektverwaltung:bvs_defect_save' defect.pk %}"
          hx-trigger="input delay:1000ms, change" hx-target="#save-status" hx-swap="innerHTML" hx-sync="this:queue last">
        {% csrf_token %}
        <div class="flex flex-wrap items-center gap-2">
            <div style="width: 6rem">{{ form.number }}</div>
            <div class="flex-1 min-w-0" style="min-width: 12rem">{{ form.location }}</div>
            <div class="flex items-center gap-1">
                <button type="button" title="Nach oben" @click="bvs.move('{% url 'objektverwaltung:bvs_defect_up' defect.pk %}')"
                        class="w-12 h-12 rounded-lg bg-gray-100 text-gray-700 text-xl hover:bg-gray-200">↑</button>
                <button type="button" title="Nach unten" @click="bvs.move('{% url 'objektverwaltung:bvs_defect_down' defect.pk %}')"
                        class="w-12 h-12 rounded-lg bg-gray-100 text-gray-700 text-xl hover:bg-gray-200">↓</button>
                <button type="button" title="Mangel löschen" @click="bvs.remove('{% url 'objektverwaltung:bvs_defect_delete' defect.pk %}', '#defect-{{ defect.pk }}')"
                        class="w-12 h-12 rounded-lg bg-red-50 text-red-700 text-xl hover:bg-red-100">✕</button>
            </div>
        </div>
        {{ form.text }}
        <div class="flex flex-wrap items-center justify-between gap-2">
            <p class="text-xs text-gray-400">{% if defect.phrase %}Mustersatz {{ defect.phrase.code }} – {{ defect.phrase.title }}{% else %}Freitext{% endif %}</p>
            <button type="button" @click="bvs.nextGap($el.closest('form').querySelector('textarea'))"
                    class="px-3 py-2 rounded-lg text-sm bg-yellow-50 text-yellow-800 hover:bg-yellow-100">Nächste Lücke „…“</button>
        </div>
    </form>
</div>
