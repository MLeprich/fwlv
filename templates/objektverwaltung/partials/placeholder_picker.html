{% comment %}
Einfüge-Menü für Platzhalter ({{objekt.adresse}} …).
Erwartet auf der Seite ein <script id="ph-catalogue" type="application/json"> (json_script von
placeholders.catalogue). Include mit ph_target = CSS-Selektor des Textfelds, gesucht zuerst im
umgebenden Formular, sonst im Dokument (Standard: "textarea").
{% endcomment %}
<div class="relative inline-block" x-data="flvsPlaceholderPicker('{{ ph_target|default:'textarea' }}')">
    <button type="button" @click="toggle()"
            class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-medium bg-gray-100 text-gray-700 hover:bg-gray-200"
            title="Platzhalter einfügen – wird in Anzeige und PDF durch die Objektdaten ersetzt">
        <span class="font-mono">{ }</span> Platzhalter
    </button>
    <div x-show="open" @click.away="open = false" @keydown.escape.window="open = false" x-cloak
         class="absolute right-0 mt-1 w-80 bg-white border border-gray-200 rounded-lg shadow-lg z-20 text-left">
        <div class="p-2 border-b border-gray-100">
            <input type="search" x-model="q" x-ref="search" placeholder="Suchen …"
                   class="w-full px-2 py-1 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500">
            <p class="text-xs text-gray-500 mt-1">Klick fügt den Platzhalter ein; „Wert“ fügt den aktuellen Text fest ein.</p>
        </div>
        <div class="max-h-80 overflow-y-auto p-2 space-y-2">
            <template x-for="g in results" :key="g.key">
                <div>
                    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider px-1" x-text="g.title"></p>
                    <template x-for="it in g.items" :key="it.key">
                        <div class="flex items-center gap-1 rounded-lg hover:bg-gray-50">
                            <button type="button" @click="insert(it.token)" class="flex-1 min-w-0 text-left px-1 py-1">
                                <span class="block text-sm text-gray-800" x-text="it.label"></span>
                                <span class="block text-xs text-gray-400 truncate"
                                      x-text="it.value === null ? it.token + ' (je Objekt)' : (it.value ? it.value.replace(/\n/g, ' · ') : it.token + ' (derzeit leer)')"></span>
                            </button>
                            <button type="button" x-show="it.value" @click="insert(it.value)" title="Aktuellen Wert fest einfügen"
                                    class="px-2 py-1 text-xs text-primary-600 hover:text-primary-800">Wert</button>
                        </div>
                    </template>
                </div>
            </template>
            <p x-show="!results.length" class="text-sm text-gray-500 text-center py-4">Kein Platzhalter gefunden.</p>
        </div>
    </div>
</div>
<script>
if (!window.flvsPlaceholderPicker) {
    window.flvsPlaceholderPicker = function (targetSelector) {
        return {
            open: false,
            q: '',
            groups: [],
            init() {
                const el = document.getElementById('ph-catalogue');
                try { this.groups = el ? JSON.parse(el.textContent) : []; } catch (e) { this.groups = []; }
            },
            get results() {
                const terms = this.q.toLowerCase().split(/\s+/).filter(Boolean);
                return this.groups
                    .map(g => ({ ...g, items: g.items.filter(it => {
                        const hay = (it.label + ' ' + it.token + ' ' + (it.value || '')).toLowerCase();
                        return terms.every(t => hay.includes(t));
                    }) }))
                    .filter(g => g.items.length);
            },
            toggle() {
                this.open = !this.open;
                if (this.open) this.$nextTick(() => this.$refs.search && this.$refs.search.focus());
            },
            target() {
                const form = this.$root.closest('form');
                return (form && form.querySelector(targetSelector)) || document.querySelector(targetSelector);
            },
            insert(text) {
                const field = this.target();
                this.open = false;
                if (!field) return;
                const start = field.selectionStart ?? field.value.length;
                const end = field.selectionEnd ?? field.value.length;
                field.value = field.value.slice(0, start) + text + field.value.slice(end);
                const pos = start + text.length;
                field.focus();
                field.setSelectionRange(pos, pos);
                field.dispatchEvent(new Event('input', { bubbles: true }));
            },
        };
    };
}
</script>
