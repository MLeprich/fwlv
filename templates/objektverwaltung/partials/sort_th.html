{# Sortierbarer Tabellenkopf: include mit key, label, current_sort, current_dir, sort_query_string; optional align='right' #}
<th class="px-4 py-3 {% if align == 'right' %}text-right{% else %}text-left{% endif %} text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">
    <a href="?sort={{ key }}&dir={% if current_sort == key and current_dir == 'asc' %}desc{% else %}asc{% endif %}{% if sort_query_string %}&{{ sort_query_string }}{% endif %}"
       class="inline-flex items-center gap-1 hover:text-gray-900 {% if current_sort == key %}text-gray-900{% endif %}"
       title="Nach {{ label }} sortieren">
        {{ label }}
        {% if current_sort == key %}
            <span aria-hidden="true">{% if current_dir == 'asc' %}&#9650;{% else %}&#9660;{% endif %}</span>
        {% else %}
            <span aria-hidden="true" class="text-gray-300">&#8597;</span>
        {% endif %}
    </a>
</th>
