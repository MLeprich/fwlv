{% extends 'base.html' %}
{% block title %}Vorlage löschen - FLVS{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-6 py-12">
    <div class="bg-white rounded-lg shadow-sm border border-red-200 p-6">
        <h1 class="text-xl font-bold text-gray-900 mb-2">Vorlage „{{ object.name }}“ löschen?</h1>
        <p class="text-gray-600 text-sm mb-6">Bereits erstellte Ausgabelisten bleiben erhalten, verlieren aber den Verweis auf die Vorlage.</p>
        <form method="post" class="flex justify-end gap-3">{% csrf_token %}
            <a href="{% url 'clothing:issue_template_detail' object.pk %}" class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg">Abbrechen</a>
            <button class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">Löschen</button>
        </form>
    </div>
</div>
{% endblock %}
