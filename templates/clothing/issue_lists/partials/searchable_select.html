{# Suchbares Dropdown über ein verstecktes <select>. Aufruf: include ... with field=form.person placeholder="Person suchen..." #}
<div x-data="{ open: false, search: '', selected: null, options: [] }" x-init="
    const select = document.getElementById('{{ field.auto_id }}');
    options = Array.from(select.options).map(o => ({ value: o.value, text: o.text })).filter(o => o.value);
    if (select.value) { selected = options.find(o => o.value === select.value) || null; }
    select.removeAttribute('required');
">
    <div class="hidden">{{ field }}</div>
    <div class="relative">
        <button type="button" @click="open = !open"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-left bg-white flex items-center justify-between {% if field.errors %}border-red-500{% endif %}">
            <span x-text="selected ? selected.text : '{{ placeholder|default:"Auswählen..." }}'" class="truncate" :class="selected ? '' : 'text-gray-400'"></span>
            <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div x-show="open" @click.away="open = false" x-cloak
             class="absolute z-20 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-80 overflow-hidden">
            <div class="p-2 border-b border-gray-200">
                <input type="text" x-model="search" @click.stop x-ref="searchInput"
                       placeholder="{{ placeholder|default:"Suchen..." }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div class="overflow-y-auto max-h-64">
                <template x-for="option in options.filter(o => o.text.toLowerCase().includes(search.toLowerCase()))" :key="option.value">
                    <button type="button"
                            @click="selected = option; document.getElementById('{{ field.auto_id }}').value = option.value; open = false"
                            class="w-full text-left px-4 py-2 hover:bg-blue-50 text-sm"
                            :class="selected && selected.value === option.value ? 'bg-blue-100 font-medium' : ''"
                            x-text="option.text"></button>
                </template>
                <div x-show="options.filter(o => o.text.toLowerCase().includes(search.toLowerCase())).length === 0"
                     class="px-4 py-3 text-sm text-gray-500">Keine Treffer</div>
            </div>
        </div>
    </div>
    {% if field.errors %}<p class="mt-1 text-sm text-red-600">{{ field.errors.0 }}</p>{% endif %}
</div>
