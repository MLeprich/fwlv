{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FLVS{% endblock %}</title>

    <!-- Tailwind CSS (lokal) -->
    <script src="{% static 'vendor/js/tailwind.js' %}"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">

    <!-- Alpine.js (lokal) -->
    <script defer src="{% static 'vendor/js/alpine.min.js' %}"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <a href="{% url 'core:landing' %}" class="flex items-center gap-3">
                <div class="inline-flex items-center justify-center w-10 h-10 bg-blue-600 rounded-full">
                    <span class="text-xl text-white">🚒</span>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">FLVS</h1>
                    <p class="text-xs text-gray-500">Feuerwehr Lagerverwaltung</p>
                </div>
            </a>
            <a href="{% url 'core:landing' %}" class="text-sm text-gray-600 hover:text-blue-600 transition-colors">
                Zur Startseite
            </a>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 text-center">
        <p class="text-sm text-gray-500">
            &copy; {{ "now"|date:"Y" }} FLVS - Feuerwehr Lagerverwaltungssystem
        </p>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
