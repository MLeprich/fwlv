{% load static %}
<link rel="stylesheet" href="{% static 'js/leaflet/leaflet.css' %}">
<script src="{% static 'js/leaflet/leaflet.js' %}"></script>
<script src="{% static 'js/einsatz_map.js' %}"></script>
<script>
window.flvsMapConfig = Object.assign({{ map_config_json|safe }}, {
    tileUrl: "{% url 'einsatzvorbereitung:tile' 0 0 0 %}".replace('/0/0/0.png', '/{z}/{x}/{y}.png'),
    missingTileUrl: "{% static 'img/tile-missing.png' %}"
});
</script>
<style>
.flvs-map { width: 100%; height: 520px; border-radius: 0.5rem; background: #eeeeec; }
.flvs-hazard-icon { background: none; border: none; }
.flvs-hazard-pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
.flvs-hazard-pin { font-size: 16px; }
.flvs-hazard-pin > * { transform: rotate(45deg); }
.flvs-hazard-pin.is-planned { opacity: 0.75; border-style: dashed; }
.flvs-popup .t { font-weight: 600; margin-bottom: 2px; }
.flvs-popup p { margin: 0 0 2px; font-size: 12px; }
.flvs-popup .warn { color: #b91c1c; font-weight: 600; }
.flvs-popup a { color: #b91c1c; text-decoration: underline; }
.flvs-map-mode.is-active { background: #dc2626; color: #fff; }
.dark .flvs-map { filter: brightness(0.9); }
</style>
