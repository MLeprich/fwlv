<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">{{ page_title }}</h1>
        {% if page_subtitle %}<p class="text-sm text-gray-500">{{ page_subtitle }}</p>{% endif %}
    </div>
    <div class="flex flex-wrap items-center gap-2">
        <a href="{% url 'einsatzvorbereitung:list' %}" class="px-3 py-2 rounded-lg text-sm font-medium {% if nav_active == 'list' %}bg-primary-600 text-white{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">Liste</a>
        <a href="{% url 'einsatzvorbereitung:map' %}" class="px-3 py-2 rounded-lg text-sm font-medium {% if nav_active == 'map' %}bg-primary-600 text-white{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">Karte</a>
        {% if can_manage %}<a href="{% url 'einsatzvorbereitung:settings' %}" class="px-3 py-2 rounded-lg text-sm font-medium {% if nav_active == 'settings' %}bg-primary-600 text-white{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">Karteneinstellungen</a>{% endif %}
        {% if can_edit %}<a href="{% url 'einsatzvorbereitung:create' %}" class="bg-primary-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-primary-700 shadow-sm">+ Neue Gefahrenstelle</a>{% endif %}
    </div>
</div>
