<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geräte Barcodes</title>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            @page {
                margin: 10mm;
            }
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .print-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }

        .header h1 {
            margin: 0;
            color: #333;
            font-size: 24px;
        }

        .header p {
            margin: 5px 0 0 0;
            color: #666;
        }

        .barcodes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .barcodes-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        .barcode-item {
            border: 2px solid #333;
            padding: 15px;
            background: white;
            page-break-inside: avoid;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .barcode-item img {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }

        .barcode-info {
            width: 100%;
        }

        .inventory-number {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 5px 0;
            word-wrap: break-word;
        }

        .device-name {
            font-size: 12px;
            color: #666;
            margin: 3px 0;
            word-wrap: break-word;
        }

        .print-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .print-button:hover {
            background: #0284c7;
        }

        .close-button {
            position: fixed;
            bottom: 30px;
            left: 30px;
            padding: 15px 30px;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .close-button:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>
    <div class="print-container">
        <div class="header">
            <h1>Geräte Barcodes</h1>
            <p>{{ devices|length }} Gerät{{ devices|length|pluralize:"e" }} ausgewählt</p>
        </div>

        <div class="barcodes-grid">
            {% for item in devices %}
            <div class="barcode-item">
                <img src="{{ item.barcode_url }}" alt="Barcode {{ item.device.inventory_number }}">
                <div class="barcode-info">
                    <p class="inventory-number">{{ item.device.inventory_number }}</p>
                    <p class="device-name">{{ item.device.master.name }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <button onclick="window.print()" class="print-button no-print">🖨️ Drucken</button>
    <button onclick="window.close()" class="close-button no-print">← Schließen</button>
</body>
</html>
