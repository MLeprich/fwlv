# =============================================================================
# FLVS - Server Configuration
# =============================================================================

# Upstream Django Application
upstream django {
    server web:8000;
    keepalive 32;
}

# HTTP Server (Redirect to HTTPS or serve directly)
server {
    listen 80;
    server_name _;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # For development/internal use without SSL, comment out the redirect below
    # and uncomment the include directive
    
    # Redirect all HTTP to HTTPS (enable in production)
    # return 301 https://$host$request_uri;

    # Include app config (for HTTP-only mode)
    include /etc/nginx/conf.d/app.include;
}

