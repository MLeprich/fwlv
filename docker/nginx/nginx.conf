# =============================================================================
# FLVS - Nginx Configuration
# =============================================================================

user nginx;
worker_processes auto;
# info statt warn: nginx protokolliert abgelehnte Requests (z.B. "400 Bad Request")
# nur auf info-Ebene mit dem konkreten Grund. Auf warn bleibt die Ursache unsichtbar.
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Header-Puffer großzügig dimensionieren.
    #
    # Firmen-Proxies mit SSO (Kerberos/NTLM) und lange Cookie-Sammlungen erzeugen sehr
    # große Request-Header. Übersteigen sie die Default-Puffer (4x 8k), lehnt nginx den
    # Request mit "400 Bad Request" ab – mit sauberer Request-Zeile, aber ohne dass er
    # Django je erreicht. Genau dieses Bild (nginx-eigene 400-Seite, kein DisallowedHost
    # in Django) trat bei der Installation hinter einem Stadt-Proxy auf.
    client_header_buffer_size 4k;
    large_client_header_buffers 8 32k;

    # Logging – host="$host" zeigt, welchen Host-Header der Proxy durchreicht,
    # xfp="..." das vom vorgelagerten Proxy gemeldete Protokoll.
    log_format main '$remote_addr - $remote_user [$time_local] host="$host" '
                    'xfp="$http_x_forwarded_proto" "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Betrieb HINTER einem vorgelagerten Reverse-Proxy (z.B. die Stadt terminiert SSL
    # und spricht intern HTTP mit uns):
    #
    # Dessen X-Forwarded-Proto übernehmen, wenn gesetzt – sonst das eigene Schema. Ohne
    # das überschriebe unser nginx das "https" des Proxys mit "$scheme" (= http auf dem
    # internen Hop), und Django hielte JEDEN Request für unverschlüsselt: Login scheitert
    # mit "403 CSRF", bei aktivem SSL-Redirect entsteht eine Endlosschleife.
    map $http_x_forwarded_proto $client_proto {
        default $scheme;
        "~.+"   $http_x_forwarded_proto;
    }
    # Ebenso den ursprünglichen Host bewahren, falls der Proxy ihn per X-Forwarded-Host
    # meldet statt im Host-Header.
    map $http_x_forwarded_host $client_host {
        default $http_host;
        "~.+"   $http_x_forwarded_host;
    }

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # Security Headers (base)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Include server configs
    include /etc/nginx/conf.d/*.conf;
}
